version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # O Vite 8 exige Node 20.19+ ou 22.12+: fixamos a versão em vez de depender da imagem padrão do Amplify.
            - nvm install 22
            - nvm use 22
            - node --version
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
